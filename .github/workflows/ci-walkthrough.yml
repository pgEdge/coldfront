name: CI - Walkthrough
on:
  push:
    branches: [main]
    paths: ['examples/walkthrough/**', '.devcontainer/**', 'docs/walkthrough*.md', '.github/workflows/ci-walkthrough.yml']
  pull_request:
    paths: ['examples/walkthrough/**', '.devcontainer/**', 'docs/walkthrough*.md', '.github/workflows/ci-walkthrough.yml']
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read
  packages: read   # pull the coldfront-duckdb-base image the app builds FROM

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose
        run: |
          docker compose -f examples/walkthrough/docker-compose.yml config --quiet
          docker compose -f examples/walkthrough/docker-compose.mesh.yml config --quiet

  smoke:
    name: Smoke Test (${{ matrix.demo }})
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - demo: tiered
            compose: docker-compose.yml
          - demo: distributed
            compose: docker-compose.mesh.yml
    steps:
      - uses: actions/checkout@v7
      # The image build needs the pgEdge repo client cert; BuildKit mounts it as a secret, never into a layer.
      - name: Write the repository client certificate
        env:
          REPO_CLIENT_CRT_PEM: ${{ secrets.PGEDGE_REPO_CLIENT_CRT }}
          REPO_CLIENT_KEY_PEM: ${{ secrets.PGEDGE_REPO_CLIENT_KEY }}
        run: |
          set -o errexit -o pipefail -o nounset
          : "${REPO_CLIENT_CRT_PEM:?is empty or unset}"
          : "${REPO_CLIENT_KEY_PEM:?is empty or unset}"
          install -d -m 0700 "${RUNNER_TEMP}/pgedge-certs"
          install -m 0600 /dev/null "${RUNNER_TEMP}/pgedge-certs/client.key"
          printf '%s\n' "$REPO_CLIENT_CRT_PEM" > "${RUNNER_TEMP}/pgedge-certs/client.crt"
          printf '%s\n' "$REPO_CLIENT_KEY_PEM" > "${RUNNER_TEMP}/pgedge-certs/client.key"
          {
            echo "REPO_CLIENT_CRT=${RUNNER_TEMP}/pgedge-certs/client.crt"
            echo "REPO_CLIENT_KEY=${RUNNER_TEMP}/pgedge-certs/client.key"
            # compose (buildx bake) won't read secret files outside the project dir otherwise; it has no --allow flag.
            echo "BUILDX_BAKE_ENTITLEMENTS_FS=0"
          } >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client jq iproute2
      - name: Run setup + the ${{ matrix.demo }} demo non-interactively
        working-directory: examples/walkthrough
        env:
          WALKTHROUGH_NONINTERACTIVE: "1"
          WALKTHROUGH_DEMO: ${{ matrix.demo }}
          WALKTHROUGH_ROWS: "200000"
        run: bash guide.sh
      - name: Assert tiering proof
        if: matrix.demo == 'tiered'
        run: |
          export PGPASSWORD=coldfront
          relk=$(psql -h localhost -U coldfront -d coldfront -tAc "SELECT relkind FROM pg_class WHERE relname='events';")
          wm=$(psql -h localhost -U coldfront -d coldfront -tAc "SELECT count(*) FROM coldfront.archive_watermark WHERE table_name='events';")
          [ "$relk" = "v" ] || { echo "events not a view (relkind=$relk)"; exit 1; }
          [ "$wm" = "1" ] || { echo "no watermark row"; exit 1; }
          echo "Tiering proof OK"
      - name: Check no services have exited
        run: |
          echo "=== Service Status ==="
          docker compose -f examples/walkthrough/${{ matrix.compose }} ps -a
          # -a is required: plain `ps` hides stopped containers, so the grep could
          # never match. lakekeeper-migrate is a one-shot that exits 0 by design;
          # any OTHER exited container is a real crash.
          if docker compose -f examples/walkthrough/${{ matrix.compose }} ps -a \
               | grep -iE 'exit' | grep -v lakekeeper-migrate; then
            echo "ERROR: a service crashed"
            docker compose -f examples/walkthrough/${{ matrix.compose }} logs
            exit 1
          fi
          echo "All services running (aside from the by-design migrate one-shot)"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f examples/walkthrough/${{ matrix.compose }} logs
      - name: Cleanup
        if: always()
        run: docker compose -f examples/walkthrough/${{ matrix.compose }} down -v
