# A ColdFront deployment YAML. It is an input to `import`, which writes it into
# the server once:
#
#   ./bin/archiver import --config config.yaml
#
# After that the server is the configuration: the tables in
# coldfront.partition_config, the cold-store credential in
# coldfront.storage_secret, and the catalog in the coldfront.warehouse and
# coldfront.lakekeeper_endpoint settings (postgresql.conf). The archiver, the
# partitioner and the compactor connect the way psql does, from the libpq
# environment (PGHOST, PGDATABASE, PGUSER, PGPASSWORD, PGSERVICE) or --dsn, and
# need no file. A YAML passed to any later run is checked against the server
# and refused if it disagrees in any value.

# Optional: the connection `import` uses when --dsn is not given; fields it
# omits come from the libpq environment.
postgres:
  dsn: "host=localhost port=5432 dbname=mydb user=myuser password=mypass sslmode=disable"

# Optional: checked against the server settings of the same name before
# anything is written; the import refuses the file if they differ, since those
# settings live in postgresql.conf.
iceberg:
  warehouse: "wh"
  lakekeeper_endpoint: "http://lakekeeper:8181/catalog"

# Cold-store backend, written through coldfront.set_storage_secret: EXACTLY ONE
# of s3 or azure, or neither for vended credentials. Any S3-compatible store
# works under s3: SeaweedFS/MinIO, real AWS S3, or Google Cloud Storage through
# its S3-interoperability endpoint (see the gcs example below).
s3:
  endpoint: "seaweedfs:8333"    # S3-compatible store endpoint (no http://). OMIT
                                # for real AWS S3 (see the AWS example below).
  region: "us-east-1"           # optional, default: "us-east-1"
  access_key: "admin"
  secret_key: "adminsecret"
  use_ssl: false                # true for a TLS endpoint (GCS, real AWS S3)
  url_style: "path"             # "path" (default; SeaweedFS/MinIO/GCS) or "vhost".
                                # IGNORED when endpoint is empty (real AWS S3 then
                                # uses its native virtual-hosted addressing).

# Real AWS S3: OMIT endpoint so DuckDB uses AWS's native per-Region
# virtual-hosted + HTTPS endpoint. This is REQUIRED for Regions launched after
# 2019-03-20 (e.g. ap-south-2, eu-south-2): their DNS does not route path-style
# requests and returns HTTP 400. Set region to your bucket's Region, and give
# the Lakekeeper warehouse a real-AWS s3 storage profile (path-style-access:
# false, no custom endpoint).
# s3:
#   region: "ap-south-2"          # your bucket's Region (no endpoint!)
#   access_key: "<AWS access key id>"
#   secret_key: "<AWS secret access key>"
#   use_ssl: true                 # (ignored without an endpoint; AWS is always https)

# Google Cloud Storage = the s3 backend pointed at the GCS S3-interop endpoint
# with an HMAC key pair (Console → Cloud Storage → Settings → Interoperability).
# No separate gcs backend; Lakekeeper's warehouse must use an s3 profile with
# endpoint https://storage.googleapis.com, flavor s3-compat, path-style.
# s3:
#   endpoint: "storage.googleapis.com"
#   region: "us-east-1"           # any region; GCS interop accepts the v4 sig
#   access_key: "<GCS HMAC access id>"
#   secret_key: "<GCS HMAC secret>"
#   use_ssl: true

# azure:                        # Azure ADLS Gen2 cold tier. The access key rides
#                               # inside the connection string; there is no
#                               # separate account-key field. Leave s3.* empty
#                               # when using azure.
#   connection_string: "DefaultEndpointsProtocol=https;AccountName=<account>;AccountKey=<key>;EndpointSuffix=core.windows.net"

# Vended credentials: OMIT both s3 and azure, and run
# SELECT coldfront.set_storage_secret_vended(); on the server instead. Lakekeeper
# then issues short-lived per-table credentials at access time, so no credential
# lives in this file, the database or a DuckDB secret. See
# docs/usage.md#vended-credentials.

archiver:
  # Each table becomes a coldfront.partition_config row (replicated across a
  # mesh), validated exactly as `./bin/archiver register` validates one table.
  # This list is the import input and the export output; the binaries read the
  # table, never this file, at archive and partition time.
  tables:
    - source_table: "events"        # or "myschema.events"
      partition_period: "monthly"   # "monthly" or "daily"
      hot_period: "3 months"        # tier hot PG → cold Iceberg past this age
      # retention_period: "5 years" # optional: DROP cold Iceberg data past this
      #                             # age (must exceed hot_period). Omit to keep
      #                             # cold data forever.
      # Optional (auto-detected or defaulted):
      # partition_column: "ts"      # auto-detected from pg_catalog
      # future_partitions: 3        # default: 3

    # - source_table: "logs"
    #   partition_period: "daily"
    #   hot_period: "7 days"
