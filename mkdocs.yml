site_name: ColdFront

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - meta
  - pymdownx.details
  - pymdownx.superfences
  - sane_lists

plugins:
  - search

validation:
  links:
    anchors: warn

theme:
  name: material
  custom_dir: docs/overrides
  favicon: img/favicon.ico

  logo_dark_mode: 'img/logo-dark.png'
  logo_light_mode: 'img/logo-light.png'

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.prune
    - navigation.top
    - navigation.indexes
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  generator: false

copyright: Copyright &copy; 2026 pgEdge, Inc
repo_url: https://github.com/pgEdge/ColdFront

nav:
  - pgEdge ColdFront: index.md

  - Architecture Guides:
      - architecture_guides/index.md
      - Tiered Operating Mode: architecture_tiered.md
      - Decoupled (Iceberg-Only) Operating Mode: architecture_decoupled.md
      - Vector Storage Architecture: architecture_vectors.md

  - Getting Started/Quick Start: walkthrough.md
  - Installing ColdFront: installation.md
  - Configuring ColdFront:
      - configuration.md
      - Configuring Lakekeeper: one_time_setup.md
      - Configuring your Object Store: object_store.md

  - Exploring ColdFront:
      - Exploring Tiered Storage: walkthrough_tiered.md
      - Exploring Decoupled Mode: walkthrough_decoupled.md
      - Exploring the Standalone Partitioner: walkthrough_partitioner.md
      - Exploring Distributed Mode: walkthrough_distributed.md

  - Using ColdFront:
      - using_coldfront/index.md
      - Using ColdFront in Tiered Mode: usage_tiered.md
      - Using ColdFront in Decoupled Mode: usage_decoupled.md
      - Using ColdFront in Standalone Partitioned Mode: usage_partitioner.md
      - Working with Embeddings: usage_vectors.md

  - Administration:
      - Understanding ColdFront Caveats: caveats.md
      - Using Vended Credentials: vended_credentials.md
      - Reading and Writing ColdFront Tables: reading_writing.md
      - Understanding Supported Column Types: supported_types.md
      - Setting Up a Distributed Deployment: distributed_setup.md
      - Compacting the Cold Tier: compaction.md

  - Developer Resources:
      - Formal Model - ColdFront Decoupled-Mode Bakery (TLA+/PlusCal): formal/README.md

  - Release Notes - Changelog: changelog.md
  - License: LICENSE.md

  - Source: source.md
