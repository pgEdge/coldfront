site_name: ColdFront

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - meta
  - pymdownx.details
  - pymdownx.superfences
  - sane_lists

plugins:
  - search

validation:
  links:
    anchors: warn

theme:
  name: material
  custom_dir: docs/overrides
  favicon: img/favicon.ico

  logo_dark_mode: 'img/logo-dark.png'
  logo_light_mode: 'img/logo-light.png'

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.prune
    - navigation.top
    - toc.follow

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra:
  generator: false

copyright: Copyright &copy; 2026 pgEdge, Inc
repo_url: https://github.com/pgEdge/ColdFront

nav:
  - pgEdge ColdFront: index.md
  - Installing ColdFront: installation.md
  - Getting Started:
      - Getting Started with ColdFront: walkthrough.md
      - ColdFront Walkthroughs:
          - Exploring Tiered Storage: walkthrough_tiered.md
          - Exploring Decoupled Mode: walkthrough_decoupled.md
          - Exploring the Standalone Partitioner: walkthrough_partitioner.md
          - Exploring Distributed Mode: walkthrough_distributed.md
      - Configuring an S3 Bucket as your Object Store: object_store.md

  - Architecture:
      - pgEdge ColdFront - Architecture: architecture.md
      - ColdFront - Tiered Operating Mode: architecture_tiered.md
      - Decoupled (Iceberg-Only) Operating Mode: architecture_decoupled.md
      - Vector Storage Architecture: architecture_vectors.md

  - Using ColdFront: usage.md
  - Working with Embeddings: usage_vectors.md
  - COMPACTOR - Cold-Tier Table Maintenance: compaction.md

  - Developer Resources:
      - Formal Model - ColdFront Decoupled-Mode Bakery (TLA+/PlusCal): formal/README.md

  - Changelog: changelog.md
  - License: LICENSE.md
