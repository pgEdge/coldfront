\* The orphan reaper, ON (Reaper = TRUE). Identical topology to
\* Bakery_v2_wedge.cfg: two writers share node nA and one crashes holding a
\* claim. The survivor holds the node-local advisory xact lock, which proves the
\* dead writer's backend is gone, so it deletes the orphan claim and its acks in
\* the same step that inserts its own claim, and forwards anything deferred
\* behind the orphan.
\*
\* TLC is EXPECTED to report no error: SurvivorProgress HOLDS (the surviving
\* writer decides) and all four safety invariants hold, so the reap never breaks
\* mutual exclusion. Three touch-points make it live: the claim path (BeginClaim
\* reaps same-node orphans under the table lock), the apply path (the Applier
\* reaps on its defer branch when the lock is free), and the waiter's poke (the
\* Poker re-runs the peer's defer branch for a writer stuck at WaitAcks, which is
\* what unwedges a waiter whose peer's claim holder died AFTER deferring to it).

CONSTANTS
  Writers       = {a1, a2, b1}
  NodeParts     = {{a1, a2}, {b1}}
  SameNodeLock  = TRUE
  Reaper        = TRUE
  NodeRetries   = TRUE
  MaxTickets    = 3
  MaxIcebergLen = 5
  MaxCrashes    = 1
  AsyncParquet  = FALSE
  RestampPatch  = TRUE
  SafeAcks      = TRUE

SPECIFICATION Spec

INVARIANTS
  NoLakekeeperConflict
  RollbackNoIceberg
  UniqueTickets
  TicketOrderPreserved

PROPERTY
  SurvivorProgress
