\* Liveness config for Bakery.tla with the TWO-STATEMENT ack check
\* (AtomicAckCheck=FALSE): coldfront._on_ack_apply reads the claim, and then the
\* table's claim key, in two statements. The claim's insert can complete between
\* them, so an ack that arrives while the claim is still committing is dropped
\* although the claim is live, and the claimant waits for it forever. Checks
\* EventualProgress: every writer eventually reaches a terminal decision, which
\* is EXPECTED to be VIOLATED here. The four safety invariants still HOLD (a
\* dropped ack is a liveness failure, not a wrong commit). Otherwise the same
\* topology as Bakery_fixed.cfg, which checks the fix (AtomicAckCheck=TRUE).
\* No SYMMETRY (unsound with liveness checking in TLC).
CONSTANTS
  Writers       = {w1, w2, w3}
  NodeParts     = {{w1}, {w2}, {w3}}
  SameNodeLock  = TRUE
  Reaper        = FALSE
  NodeRetries   = FALSE
  MaxTickets    = 6
  MaxIcebergLen = 5
  MaxCrashes    = 0
  AsyncParquet  = FALSE
  RestampPatch  = TRUE
  SafeAcks      = TRUE
  AtomicAckCheck = FALSE
  AdoptClaims   = FALSE

SPECIFICATION Spec

INVARIANTS
  NoAckOutlivesClaim
  NoLakekeeperConflict
  RollbackNoIceberg
  UniqueTickets
  TicketOrderPreserved

PROPERTIES
  EventualProgress
