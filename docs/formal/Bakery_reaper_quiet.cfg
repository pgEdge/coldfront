\* The poke's case: reaper ON, NodeRetries = FALSE, so the crash may strand a
\* claim on a node that no later local writer and no new peer claim ever reaches,
\* while the only peer that would write is the one already deferred behind the
\* orphan. The claim path and the apply path both need such an event and get
\* none; the waiter's poke is the one thing that still reaches that node.
\*
\* TLC is EXPECTED to report no error: SurvivorProgress HOLDS through the Poker
\* alone, and all four safety invariants hold. Remove the Poker and this config
\* violates SurvivorProgress in exactly that trace.

CONSTANTS
  Writers       = {a1, a2, b1}
  NodeParts     = {{a1, a2}, {b1}}
  SameNodeLock  = TRUE
  Reaper        = TRUE
  NodeRetries   = FALSE
  MaxTickets    = 3
  MaxIcebergLen = 5
  MaxCrashes    = 1
  AsyncParquet  = FALSE
  RestampPatch  = TRUE
  SafeAcks      = TRUE
  AdoptClaims   = FALSE

SPECIFICATION Spec

INVARIANTS
  NoLakekeeperConflict
  RollbackNoIceberg
  UniqueTickets
  TicketOrderPreserved

PROPERTY
  SurvivorProgress
