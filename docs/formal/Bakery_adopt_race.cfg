\* TLC config for Bakery.tla: two nodes adopting ONE Iceberg table with the
\* registration OUTSIDE the bakery (AdoptClaims = FALSE), which is today's
\* coldfront.adopt_iceberg_table. _adopt_preflight reads only the calling node's
\* coldfront.tiered_views, so while the peer's row is still in flight both
\* preflights pass and both nodes INSERT. On a mesh the two rows then replicate
\* into each other and the second violates UNIQUE (iceberg_table) inside the
\* apply worker, where no status field reports it.
\*
\* TLC is EXPECTED to report NoDoubleRegistration VIOLATED. Paired with
\* Bakery_adopt.cfg, which is the same topology with the claim held, this is
\* the formal statement that the claim is what closes the window. One writer per
\* node, so the node-local advisory lock is not what is under test. No crashes.

CONSTANTS
  Writers       = {a1, b1}
  NodeParts     = {{a1}, {b1}}
  SameNodeLock  = TRUE
  Reaper        = FALSE
  NodeRetries   = FALSE
  MaxTickets    = 2
  MaxIcebergLen = 4
  MaxCrashes    = 0
  AsyncParquet  = FALSE
  RestampPatch  = FALSE
  SafeAcks      = TRUE
  AdoptClaims   = FALSE

SPECIFICATION Spec

INVARIANTS
  NoDoubleRegistration
