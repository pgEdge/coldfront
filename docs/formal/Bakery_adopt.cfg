\* TLC config for Bakery.tla: two nodes adopting ONE Iceberg table with the
\* registration held UNDER the table's bakery claim (AdoptClaims = TRUE). The
\* second node's _adopt_preflight cannot run until the first has released, and
\* the release runs in the COMMIT callback, after the registry INSERT is
\* committed and ahead of the drained ack that frees the waiter. So the waiter
\* reads the row and refuses instead of registering a second relation.
\*
\* TLC is EXPECTED to report no error: NoDoubleRegistration holds, and the four
\* safety invariants the other configs check are re-checked here so that adding
\* a claimant cannot be shown to cost anything the bakery already guarantees.
\* Same topology as Bakery_adopt_race.cfg. No crashes.

CONSTANTS
  Writers       = {a1, b1}
  NodeParts     = {{a1}, {b1}}
  SameNodeLock  = TRUE
  Reaper        = FALSE
  NodeRetries   = FALSE
  MaxTickets    = 2
  MaxIcebergLen = 4
  MaxCrashes    = 0
  AsyncParquet  = FALSE
  RestampPatch  = FALSE
  SafeAcks      = TRUE
  AdoptClaims   = TRUE

SPECIFICATION Spec

INVARIANTS
  NoDoubleRegistration
  NoLakekeeperConflict
  RollbackNoIceberg
  UniqueTickets
  TicketOrderPreserved
