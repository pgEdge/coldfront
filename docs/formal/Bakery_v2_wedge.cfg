\* The wedge the reaper exists to remove, WITHOUT the reaper (Reaper = FALSE).
\* Two writers share node nA; one of them crashes while holding a claim. Its row
\* stays in coldfront.claims with no owner, and coldfront._claim_iceberg_lock's
\* same-node guard blocks every later writer on that node forever.
\*
\* TLC is EXPECTED to REPORT A VIOLATION of SurvivorProgress: the surviving
\* same-node writer never reaches a decision. Safety still holds -- a stranded
\* writer commits nothing -- so the four invariants are checked too and pass.
\* Pairs with Bakery_v2_reaper.cfg, which is this config with Reaper = TRUE.

CONSTANTS
  Writers       = {a1, a2, b1}
  NodeParts     = {{a1, a2}, {b1}}
  SameNodeLock  = TRUE
  Reaper        = FALSE
  NodeRetries   = TRUE
  MaxTickets    = 3
  MaxIcebergLen = 5
  MaxCrashes    = 1
  AsyncParquet  = FALSE
  RestampPatch  = TRUE
  SafeAcks      = TRUE
  AdoptClaims   = FALSE

SPECIFICATION Spec

INVARIANTS
  NoLakekeeperConflict
  RollbackNoIceberg
  UniqueTickets
  TicketOrderPreserved

PROPERTY
  SurvivorProgress
