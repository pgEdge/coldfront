\* TLC config for Bakery.tla: the patched async ordering with SEVERAL cold
\* writers per node. Writers a1 and a2 share node nA and b1 is on node nB, as in
\* Bakery_samenode.cfg; AsyncParquet and RestampPatch are on, as in
\* Bakery_async.cfg. Every writer stages its parquet before it takes the claim,
\* so a1 and a2 stage concurrently; the node-local advisory lock then admits one
\* of them to the bakery, and the commit POST re-stamps parent_snapshot_id under
\* the claim. The cold sink, which stages several batches before its one claim,
\* is the same writer: the model's Stage covers every upload a transaction makes
\* before it claims.
\*
\* TLC is EXPECTED to report no error: all four safety invariants hold. Without
\* SameNodeLock this topology violates NoLakekeeperConflict exactly as
\* Bakery_samenode_race.cfg does, so the check is not vacuous. No crashes.

CONSTANTS
  Writers       = {a1, a2, b1}
  NodeParts     = {{a1, a2}, {b1}}
  SameNodeLock  = TRUE
  Reaper        = FALSE
  NodeRetries   = FALSE
  MaxTickets    = 3
  MaxIcebergLen = 5
  MaxCrashes    = 0
  AsyncParquet  = TRUE
  RestampPatch  = TRUE
  SafeAcks      = TRUE
  AdoptClaims   = FALSE

SPECIFICATION Spec

INVARIANTS
  NoAckOutlivesClaim
  NoLakekeeperConflict
  RollbackNoIceberg
  UniqueTickets
  TicketOrderPreserved
