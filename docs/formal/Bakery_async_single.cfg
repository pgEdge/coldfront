\* TLC config for Bakery.tla: the patched async ordering on a SINGLE node with
\* three concurrent cold writers (NodeParts = {{a1, a2, a3}}). A node without
\* Spock has no peer and no claim row: coldfront._take_iceberg_claim takes the
\* per-table advisory transaction lock alone, which is SameNodeLock here. The
\* claim the model still inserts has no peer to see it and changes nothing a
\* same-node writer does, so this is the vanilla deployment: stage outside the
\* lock, lock, re-stamp parent_snapshot_id under the lock, commit, release.
\* With one node the Applier and the Poker never run.
\*
\* TLC is EXPECTED to report no error: all four safety invariants hold. No
\* crashes.

CONSTANTS
  Writers       = {a1, a2, a3}
  NodeParts     = {{a1, a2, a3}}
  SameNodeLock  = TRUE
  Reaper        = FALSE
  NodeRetries   = FALSE
  MaxTickets    = 3
  MaxIcebergLen = 5
  MaxCrashes    = 0
  AsyncParquet  = TRUE
  RestampPatch  = TRUE
  SafeAcks      = TRUE
  AdoptClaims   = FALSE

SPECIFICATION Spec

INVARIANTS
  NoAckOutlivesClaim
  NoLakekeeperConflict
  RollbackNoIceberg
  UniqueTickets
  TicketOrderPreserved
